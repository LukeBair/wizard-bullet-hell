<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="chars.js"></script><script src="chars2.js"></script><script>
// Renders every sprite for one art style into window.OUT = {name: dataURL}. Run with node render.js.
const STYLE=new URLSearchParams(location.search).get('style');
const PPU={Dusk:20,Crt:28,Vector:128}[STYLE];
const PIXEL=STYLE!=='Vector';
const DUSKPAL=['#1d1a2b','#2b2f4a','#3e5a4e','#6f9b7a','#f0d2bc','#e5555f','#8c3446','#141120'];
const ENDESGA='be4a2f d77643 ead4aa e4a672 b86f50 733e39 3e2731 a22633 e43b44 f77622 feae34 fee761 63c74d 3e8948 265c42 193c3e 124e89 0099db 2ce8f5 ffffff c0cbdc 8b9bb4 5a6988 3a4466 262b44 181425 ff0044 68386c b55088 f6757a e8b796 c28569 000000'.split(' ').map(h=>'#'+h);
const PAL=(STYLE==='Dusk'?DUSKPAL:ENDESGA).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const OUTLINE=STYLE==='Dusk'?'#141120':(STYLE==='Crt'?'#000000':'#15111c');

// Colour roles. "game" matches the classic colours in EnemyRoster; "dusk" is the 7-colour palette.
const D={bg:'#1d1a2b',navy:'#2b2f4a',ds:'#3e5a4e',sg:'#6f9b7a',cr:'#f0d2bc',co:'#e5555f',dc:'#8c3446'};
const ROLES={
game:{
 player:{robe:'#7340d9',robe2:'#9a6be0',skin:'#ffd9b3',beard:'#ffffff',eye:'#1a1430',hat:'#50309a',band:'#ffcc2e',accent:'#ffe45c',staff:'#9a6633',orb:'#80f2ff'},
 blob:{slime:'#73d959',shine:'#e0ffd0',eye:'#1a1430'},
 bat:{wing:'#5a3a80',batbody:'#734d99',eyeE:'#ffffff'},
 beast:{fur:'#8c8073',fur2:'#6e665c',snout:'#c9c0b3',eyeE:'#d94d40'},
 goblin:{green:'#8cbf4d',cloth:'#8a5a30',wood:'#6b4422',eyeE:'#ff8c33'},
 wizard:{robe:'#d94059',robe2:'#ff6680',hat:'#99264a',band:'#ff66b3',accent:'#ff66b3',skin:'#ffd9b3',beard:'#6a3a20',orb:'#ff66b3',staff:'#6b4422',eye:'#1a1430'},
 mushroom:{cap:'#d94050',spot:'#ffffff',stem:'#e6d9bf',eye:'#1a1430'},
 pixie:{glow:'#66ffe6',body:'#ffbff2',wing:'#66ffe6',hair:'#ff80d0',eye:'#1a1430'},
 mole:{dirt:'#5a4030',body:'#805940',claw:'#f2bf66',nose:'#ff8c99',eye:'#1a1430'},
 treant:{bark:'#73523a',bark2:'#5a3e2a',leaf:'#66d959',hole:'#2a1a10',eyeE:'#ffe45c'},
 witch:{robe:'#4d2666',robe2:'#6b3a8a',hat:'#2a1438',band:'#80ff99',accent:'#80ff99',skin:'#9bd08a',beard:'#9bd08a',orb:'#80ff99',staff:'#4a3020',eye:'#1a1430'},
 headmaster:{robe:'#33408c',robe2:'#4d5fb3',hat:'#22285e',band:'#ffcc4d',accent:'#ffcc4d',skin:'#ffd9b3',beard:'#e6e6f2',orb:'#ffcc4d',staff:'#4a3020',eye:'#1a1430'},
 golem:{rock:'#66667a',rock2:'#8a8a9e',crystal:'#80f2ff',eyeE:'#ffe45c'},
 tree:{leafDark:'#1d5a2a',leaf:'#2f7d3a',leafLight:'#5aa84a'},
 pillar:{base:'#4a4256',stone:'#8a8096',stoneDark:'#6a6278',stoneLight:'#b0a8bc'},
 rock:{stoneDark:'#3e3c4a',stone:'#5e5c6e',stoneLight:'#8a889a',crystal:'#80f2ff'},
},
dusk:{
 player:{robe:D.dc,robe2:D.co,skin:D.cr,beard:D.cr,eye:'#141120',hat:D.navy,band:D.co,accent:D.cr,staff:D.ds,orb:D.cr},
 blob:{slime:D.sg,shine:D.cr,eye:D.co},
 bat:{wing:D.ds,batbody:D.sg,eyeE:D.cr},
 beast:{fur:D.ds,fur2:D.navy,snout:D.sg,eyeE:D.co},
 goblin:{green:D.sg,cloth:D.ds,wood:D.navy,eyeE:D.cr},
 wizard:{robe:D.sg,robe2:D.ds,hat:D.ds,band:D.co,accent:D.co,skin:D.cr,beard:D.navy,orb:D.co,staff:D.navy,eye:'#141120'},
 mushroom:{cap:D.co,spot:D.cr,stem:D.cr,eye:'#141120'},
 pixie:{glow:D.cr,body:D.cr,wing:D.sg,hair:D.co,eye:'#141120'},
 mole:{dirt:D.navy,body:D.ds,claw:D.cr,nose:D.co,eye:D.cr},
 treant:{bark:D.ds,bark2:D.navy,leaf:D.sg,hole:'#141120',eyeE:D.co},
 witch:{robe:D.navy,robe2:D.ds,hat:D.dc,band:D.co,accent:D.co,skin:D.sg,beard:D.sg,orb:D.co,staff:D.navy,eye:'#141120'},
 headmaster:{robe:D.cr,robe2:D.sg,hat:D.dc,band:D.cr,accent:D.cr,skin:D.cr,beard:D.cr,orb:D.co,staff:D.navy,eye:'#141120'},
 golem:{rock:D.ds,rock2:D.sg,crystal:D.cr,eyeE:D.co},
 tree:{leafDark:D.navy,leaf:D.navy,leafLight:D.ds},
 pillar:{base:D.navy,stone:D.ds,stoneDark:D.navy,stoneLight:D.sg},
 rock:{stoneDark:D.navy,stone:D.ds,stoneLight:D.sg,crystal:D.cr},
}};
const R=ROLES[STYLE==='Dusk'?'dusk':'game'];
// name, shape, roles, world size in units (square), bbox of the shape in its own units [x0,y0,x1,y1]
const SPECS=[
 ['player',C.wizard,R.player,1.5,[-17,-43,23,22]],
 ['enemy_blob',C.slime,R.blob,0.9,[-13,-12,13,10]],
 ['enemy_bat',C.bat,R.bat,1.1,[-23,-12,23,8]],
 ['enemy_beast',C.wolf,R.beast,1.4,[-13,-21,13,36]],
 ['enemy_goblin',C.goblin,R.goblin,1.25,[-20,-14,20,15]],
 ['enemy_wizard',C.wizard,R.wizard,1.4,[-17,-43,23,22]],
 ['enemy_mushroom',C.mushroom,R.mushroom,1.1,[-17,-19,17,15]],
 ['enemy_pixie',C.pixie,R.pixie,1.0,[-18,-14,18,14]],
 ['enemy_mole',C.mole,R.mole,1.3,[-19,-15,19,16]],
 ['enemy_treant',C.treant,R.treant,3.6,[-56,-56,56,46]],
 ['enemy_witch',C.wizard,R.witch,2.6,[-17,-43,23,22]],
 ['enemy_headmaster',C.wizard,R.headmaster,2.6,[-17,-43,23,22]],
 ['enemy_golem',C.golem,R.golem,3.6,[-51,-47,51,31]],
 ['obstacle_tree',C.canopy,R.tree,2.3,[-22,-22,22,22]],
 ['obstacle_pillar',C.pillar,R.pillar,2.0,[-18,-18,18,18]],
 ['obstacle_rock',C.rock,R.rock,2.0,[-19,-18,19,18]],
];
function snap(r,g,b){let best=0,bd=1e9;for(let i=0;i<PAL.length;i++){const p=PAL[i],d=(p[0]-r)**2*0.3+(p[1]-g)**2*0.59+(p[2]-b)**2*0.11;if(d<bd){bd=d;best=i;}}return PAL[best];}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(f>0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}else{r*=1+f;g*=1+f;b*=1+f;}return `rgb(${r|0},${g|0},${b|0})`;}
function pixelPen(x,p){return{part(r,b){x.beginPath();b(x);x.fillStyle=p[r]||'#f0f';x.fill();},
 dot(r,X,Y,rr){x.fillStyle=p[r];const s=Math.max(1,Math.round(rr*1.4));x.fillRect(Math.round(X-s/2),Math.round(Y-s/2),s,s);},
 shadow(){},star(r,X,Y,rr){x.fillStyle=p[r];const q=Math.max(1,Math.round(rr*.5));x.fillRect(Math.round(X)-q,Math.round(Y),q*2+1,1);x.fillRect(Math.round(X),Math.round(Y)-q,1,q*2+1);},
 orb(r,X,Y,rr){x.fillStyle=p[r];x.beginPath();x.arc(X,Y,Math.max(1.6,rr),0,7);x.fill();}};}
function vectorPen(x,p,lw){return{part(r,b){const c=p[r]||'#f0f';x.beginPath();b(x);x.fillStyle=shade(c,-.3);x.fill();x.save();x.clip();x.translate(-lw*.8,-lw);x.beginPath();b(x);x.fillStyle=c;x.fill();x.restore();x.beginPath();b(x);x.lineWidth=lw;x.lineJoin='round';x.strokeStyle=OUTLINE;x.stroke();},
 dot(r,X,Y,rr){x.fillStyle=p[r];x.beginPath();x.arc(X,Y,rr,0,7);x.fill();},shadow(){},
 star(r,X,Y,rr){x.beginPath();for(let i=0;i<10;i++){const q=i%2?rr*.45:rr,a=-Math.PI/2+i*Math.PI/5;x.lineTo(X+Math.cos(a)*q,Y+Math.sin(a)*q);}x.closePath();x.fillStyle=p[r];x.fill();},
 orb(r,X,Y,rr){const g=x.createRadialGradient(X,Y,0,X,Y,rr*1.8);g.addColorStop(0,'#ffffff');g.addColorStop(.45,p[r]);g.addColorStop(1,hexA(p[r],0));x.fillStyle=g;x.beginPath();x.arc(X,Y,rr*1.8,0,7);x.fill();}};}
function postPixel(c){const x=c.getContext('2d'),N=c.width,d=x.getImageData(0,0,N,N),a=d.data;
 for(let i=0;i<a.length;i+=4){if(a[i+3]<110)a[i+3]=0;else{const s=snap(a[i],a[i+1],a[i+2]);a[i]=s[0];a[i+1]=s[1];a[i+2]=s[2];a[i+3]=255;}}
 const o=[parseInt(OUTLINE.slice(1,3),16),parseInt(OUTLINE.slice(3,5),16),parseInt(OUTLINE.slice(5,7),16)];const al=new Uint8Array(N*N);for(let i=0;i<N*N;i++)al[i]=a[i*4+3];
 for(let y=0;y<N;y++)for(let x0=0;x0<N;x0++){const i=y*N+x0;if(al[i])continue;if((x0>0&&al[i-1])||(x0<N-1&&al[i+1])||(y>0&&al[i-N])||(y<N-1&&al[i+N])){a[i*4]=o[0];a[i*4+1]=o[1];a[i*4+2]=o[2];a[i*4+3]=255;}}
 x.putImageData(d,0,0);}
window.OUT={};
for(const [name,fn,roles,size,bb] of SPECS){
 const N=Math.max(8,Math.round(size*PPU));const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');
 const bw=bb[2]-bb[0],bh=bb[3]-bb[1],margin=PIXEL?2:N*0.04;const s=(N-margin*2)/Math.max(bw,bh);
 const cx=N/2-(bb[0]+bw/2)*s,cy=N/2-(bb[1]+bh/2)*s;
 const pen=PIXEL?pixelPen(x,roles):vectorPen(x,roles,Math.max(2,N/48));
 fn(pen,cx,cy,s);if(PIXEL)postPixel(c);OUT[name]=c.toDataURL('image/png');}
// Tintable white shapes, 1 world unit wide: bullet (soft edge ring) and gem.
function shape(name,N,draw){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');draw(x,N);if(PIXEL){const d=x.getImageData(0,0,N,N),a=d.data;for(let i=3;i<a.length;i+=4)a[i]=a[i]<110?0:255;x.putImageData(d,0,0);}OUT[name]=c.toDataURL('image/png');}
const BN=PIXEL?(STYLE==='Dusk'?8:10):128;
shape('bullet',BN,(x,N)=>{x.fillStyle='#ffffff';x.beginPath();x.arc(N/2,N/2,N/2-0.2,0,7);x.fill();if(!PIXEL){x.lineWidth=N*0.09;x.strokeStyle='#b8b8b8';x.beginPath();x.arc(N/2,N/2,N/2-N*0.06,0,7);x.stroke();}else{x.fillStyle='#bdbdbd';x.fillRect(0,N/2-1,1,2);}});
shape('gem',PIXEL?8:128,(x,N)=>{x.fillStyle='#ffffff';x.beginPath();x.moveTo(N/2,0);x.lineTo(N,N/2);x.lineTo(N/2,N);x.lineTo(0,N/2);x.closePath();x.fill();x.fillStyle='#c8c8c8';x.beginPath();x.moveTo(N/2,N);x.lineTo(N,N/2);x.lineTo(N/2,N/2);x.closePath();x.fill();});
window.DONE=true;
</script></body></html>
